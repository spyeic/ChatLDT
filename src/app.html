<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/chatldt-icon-v1.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/chatldt-icon-32-v1.png" />
		<link rel="apple-touch-icon" href="/chatldt-icon-180-v1.png" />
		<link rel="manifest" href="/chatldt-v1.webmanifest" />
		<meta name="application-name" content="ChatLDT" />
		<meta name="apple-mobile-web-app-title" content="ChatLDT" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Paint the canvas before Svelte/session loading. Identity is revalidated by the app.
			try {
				const theme = localStorage.getItem('ldt:theme');
				const dark =
					theme === 'dark' ||
					(theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.backgroundColor = dark ? '#171717' : '#ffffff';
				document.querySelector('meta[name="theme-color"]').content = dark ? '#171717' : '#ffffff';
			} catch {}
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="ChatLDT" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
